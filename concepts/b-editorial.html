<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blacktilde</title>
<meta name="description" content="Projects by blacktilde.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='16' fill='%23111'/><text x='16' y='24' font-family='Georgia,serif' font-size='24' text-anchor='middle' fill='%23f5f3ee'>~</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f5f3ee; --fg: #111111; --muted: #77746d; --line: #dcd8cf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #f1efe9; --muted: #8d8a83; --line: #2a2926; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 16px/1.6 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 28px 0; font-size: 14px; }
  header a { color: var(--fg); text-decoration: none; margin-left: 24px; }
  header a:hover { text-decoration: underline; }
  .logo { font-weight: 500; letter-spacing: -0.01em; }
  .hero { padding: 12vh 0 10vh; }
  h1 {
    font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
    font-size: clamp(56px, 13vw, 168px); line-height: 0.9; letter-spacing: -0.03em; margin: 0;
  }
  h1 em { font-style: italic; }
  .lede { max-width: 440px; color: var(--muted); font-size: 18px; margin: 32px 0 0; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 8px; }
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fg); }
  li a, li > div {
    display: grid; grid-template-columns: 56px 1fr 1fr 32px; align-items: baseline; gap: 16px;
    padding: 22px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none;
  }
  .n { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .t { font-family: "Instrument Serif", Georgia, serif; font-size: 32px; line-height: 1.1; }
  .d { color: var(--muted); }
  .arr { transition: transform .2s ease; justify-self: end; }
  li a:hover .arr { transform: translate(4px, -4px); }
  li a:hover .t { font-style: italic; }
  .soon { opacity: .45; }
  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 64px 0 40px; color: var(--muted); font-size: 14px; }
  footer a { color: inherit; }
  @media (max-width: 640px) {
    li a, li > div { grid-template-columns: 36px 1fr 24px; }
    .d { grid-column: 2; grid-row: 2; font-size: 14px; }
    .arr { grid-column: 3; grid-row: 1; }
    header nav a { margin-left: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">blacktilde</span>
    <nav><a href="#work">Projects</a><a href="mailto:hello@blacktilde.com">Contact</a></nav>
  </header>

  <section class="hero">
    <h1>Black<em>~</em>tilde</h1>
    <p class="lede">An independent home for small, carefully made software. Each project lives on its own subdomain.</p>
  </section>

  <section id="work">
    <div class="label">Index</div>
    <ol id="projects"></ol>
  </section>

  <footer>
    <span>© <span id="y"></span> blacktilde.com</span>
    <span><a href="https://github.com/blacktilde">GitHub</a></span>
  </footer>
</div>
<script>
  // Add projects here. Set status: "soon" for ones not live yet.
  const projects = [
    { name: "Notes",  sub: "notes",  desc: "Placeholder — a short line about this project." },
    { name: "Status", sub: "status", desc: "Placeholder — another project description." },
    { name: "Lab",    sub: "lab",    desc: "Coming soon.", status: "soon" },
  ];
  const ol = document.getElementById("projects");
  projects.forEach((p, i) => {
    const soon = p.status === "soon";
    const li = document.createElement("li");
    const inner = `<span class="n">${String(i + 1).padStart(2, "0")}</span>
      <span class="t">${p.name}</span><span class="d">${p.desc}</span>
      <span class="arr">${soon ? "" : "↗"}</span>`;
    li.innerHTML = soon ? `<div class="soon">${inner}</div>`
                        : `<a href="https://${p.sub}.blacktilde.com">${inner}</a>`;
    ol.appendChild(li);
  });
  document.getElementById("y").textContent = new Date().getFullYear();
</script>
</body>
</html>
