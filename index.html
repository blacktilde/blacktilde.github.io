<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blacktilde</title>
<meta name="description" content="Projects by blacktilde.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d0c; --fg: #d6dbd8; --muted: #6b736f; --accent: #7ee787; --link: #79c0ff; --line: #1c211f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.7 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 16px;
  }
  main { width: 100%; max-width: 760px; }
  .prompt { color: var(--muted); }
  .prompt b { color: var(--accent); font-weight: 600; }
  h1 { font-size: clamp(40px, 9vw, 72px); line-height: 1; margin: 12px 0 8px; font-weight: 600; letter-spacing: -0.03em; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); margin: 0 0 40px; }
  .ls { border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: 110px 1fr; gap: 0 24px; padding: 12px 0;
    border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
  }
  a.row:hover { background: #111513; }
  a.row:hover .name { text-decoration: underline; }
  .perm { color: var(--muted); }
  .name { color: var(--link); }
  .desc { grid-column: 2; color: var(--muted); font-size: 13px; }
  .soon .name { color: var(--muted); }
  .cursor { display: inline-block; width: 9px; height: 1.1em; background: var(--accent); vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; display: flex; gap: 24px; flex-wrap: wrap; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--fg); }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } .perm { display: none; } .desc { grid-column: 1; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="prompt"><b>guest@blacktilde</b>:~$ whoami</div>
  <h1>black<span>~</span>tilde</h1>
  <p class="tag">a home directory for small projects.</p>

  <div class="prompt"><b>guest@blacktilde</b>:~$ ls -l projects/</div>
  <div class="ls" id="projects"></div>

  <p class="prompt"><b>guest@blacktilde</b>:~$ <span class="cursor"></span></p>

  <footer>
    <span>© <span id="y"></span> blacktilde</span>
    <a href="https://github.com/blacktilde">github</a>
    <a href="mailto:hello@blacktilde.com">email</a>
  </footer>
</main>
<script>
  // Add projects here. Set status: "soon" for ones not live yet.
  const projects = [
    { sub: "notes",  desc: "Placeholder — a short line about this project." },
    { sub: "status", desc: "Placeholder — another project description." },
    { sub: "lab",    desc: "Something new is on the way.", status: "soon" },
  ];
  const el = document.getElementById("projects");
  for (const p of projects) {
    const soon = p.status === "soon";
    const row = document.createElement(soon ? "div" : "a");
    row.className = "row" + (soon ? " soon" : "");
    if (!soon) row.href = `https://${p.sub}.blacktilde.com`;
    row.innerHTML = `<span class="perm">${soon ? "d---------" : "drwxr-xr-x"}</span>
      <span class="name">${p.sub}.blacktilde.com${soon ? " (soon)" : ""}</span>
      <span class="desc">${p.desc}</span>`;
    el.appendChild(row);
  }
  document.getElementById("y").textContent = new Date().getFullYear();
</script>
</body>
</html>
