<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blacktilde</title>
<meta name="description" content="Projects by Blacktilde.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg: #0a0a0a; --fg: #ededed; --muted: #7a7a7a; --line: #1f1f1f; --pill: rgba(18,18,18,.8); --hover: #1a1a1a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  /* The nav is one surface: the bar and the project panel share border + background. */
  nav {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    width: min(340px, calc(100% - 32px));
    border: 1px solid var(--line); border-radius: 26px; background: var(--pill);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    overflow: hidden;
  }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px 8px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; font-weight: 600; letter-spacing: -.01em; }
  .mark { width: 26px; height: 26px; }
  .mark rect { fill: var(--fg); } .mark path { stroke: var(--bg); }
  .links { display: flex; gap: 20px; align-items: center; }
  .links a, .links button { color: var(--muted); text-decoration: none; font: inherit; font-size: 14px; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .links a:hover, .links button:hover, nav.open .links button { color: var(--fg); }
  .gh { width: 18px; height: 18px; display: block; }
  .chev { width: 10px; height: 10px; transition: transform .25s ease; }
  nav.open .chev { transform: rotate(180deg); }

  .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  nav.open .panel { grid-template-rows: 1fr; }
  .panel > div { overflow: hidden; }
  .panel ul { list-style: none; margin: 0 10px; padding: 6px 0 10px; border-top: 1px solid var(--line); }
  .panel a { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 10px; border-radius: 12px; color: var(--fg); text-decoration: none; font-size: 14px; }
  .panel a:hover { background: var(--hover); }
  .panel .p { display: flex; align-items: center; gap: 10px; }
  .pl { width: 22px; height: 22px; border-radius: 5px; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  .panel .d { color: var(--muted); font-size: 13px; }

  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 16px 64px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .hero-mark { width: 120px; height: 120px; border-radius: 30px;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease; }
  .hero-mark:hover { transform: scale(1.06) rotate(-3deg); box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 20px 60px -10px rgba(255,255,255,.18); }
  .hero-mark rect { fill: var(--fg); } .hero-mark path { stroke: var(--bg); }
</style>
</head>
<body>
<nav id="nav">
  <div class="bar">
    <a class="brand" href="/"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M7 18c2-5 5-5 9-2s7 3 9-2" stroke-width="3" fill="none" stroke-linecap="round"/></svg>Blacktilde</a>
    <div class="links">
      <button id="toggle" aria-expanded="false" aria-controls="panel">Projects
        <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></button>
      <a href="https://github.com/blacktilde" aria-label="GitHub" title="GitHub"><svg class="gh" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    </div>
  </div>
  <div class="panel" id="panel"><div>
    <!-- Add projects here: logo in icons/, name, short description. -->
    <ul>
      <li><a href="https://ping.blacktilde.com"><span class="p"><img class="pl" src="icons/ping.svg" alt="">Ping</span><span class="d">HTTP client</span></a></li>
      <li><a href="https://boards.blacktilde.com"><span class="p"><img class="pl" src="icons/boards.svg" alt="">Boards</span><span class="d">Kanban boards</span></a></li>
    </ul>
  </div></div>
</nav>
<main>
  <h1 class="sr-only">Blacktilde</h1>
  <svg class="hero-mark" id="hero" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path id="wave" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
</main>
<script>
  const nav = document.getElementById("nav"), t = document.getElementById("toggle");
  const set = o => { nav.classList.toggle("open", o); t.setAttribute("aria-expanded", o); };
  t.onclick = e => { e.stopPropagation(); set(!nav.classList.contains("open")); };
  document.addEventListener("click", e => { if (!nav.contains(e.target)) set(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") set(false); });

  // Hero logo: on hover the tilde turns into a travelling wave; on leave it glides back to rest.
  (() => {
    const hero = document.getElementById("hero"), wave = document.getElementById("wave");
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let phase = 0, amp = 3, hovering = false, raf = 0, last = 0;
    const draw = () => {
      let d = "";
      for (let i = 0; i <= 36; i++) {
        const t = i / 36, x = 7 + 18 * t, y = 16.5 - amp * Math.sin(2 * Math.PI * t + phase);
        d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
      }
      wave.setAttribute("d", d);
    };
    const step = now => {
      const dt = Math.min(50, now - (last || now)) / 1000; last = now;
      if (hovering) { phase -= dt * 7; amp += (4 - amp) * Math.min(1, dt * 6); }
      else {
        const target = Math.floor(phase / (2 * Math.PI)) * 2 * Math.PI; // next rest position ahead
        phase += (target - phase) * Math.min(1, dt * 5); amp += (3 - amp) * Math.min(1, dt * 6);
        if (Math.abs(target - phase) < 0.01 && Math.abs(amp - 3) < 0.01) { phase = 0; amp = 3; draw(); raf = 0; last = 0; return; }
      }
      draw(); raf = requestAnimationFrame(step);
    };
    const start = () => { if (!raf && !still) raf = requestAnimationFrame(step); };
    hero.addEventListener("pointerenter", () => { hovering = true; start(); });
    hero.addEventListener("pointerleave", () => { hovering = false; start(); });
    draw();
  })();
</script>
</body>
</html>
